# Pushing a tag like v0.1.0-beta builds every download on GitHub's own machines, straight from
# the tagged source, and attaches signed build provenance. Anyone can then check that a file came
# from this repository and this workflow:  gh attestation verify <file> --repo <owner>/<repo>
# The release is created as a draft so it can be reviewed first. Releases carry the two mod jars;
# the launcher joins them once it's code-signed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: API server tests
        run: node server/test.js
      - name: Build and test everything
        run: ./gradlew build
      - name: Collect release files and checksums
        run: |
          mkdir release
          cp platform/v1_8_9/build/libs/coolclient-1.8.9-*.jar release/
          cp platform/v1_21_4/build/libs/coolclient-1.21.4-*.jar release/
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Provenance attestations need a public repository (or GitHub Enterprise).
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: release/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes \
            --title "Cool Client $GITHUB_REF_NAME"
